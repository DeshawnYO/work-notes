name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check Python syntax without importing business modules
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          files = list(Path('.').glob('*.py'))
          for directory in ('scripts', 'packaging'):
              files.extend(Path(directory).rglob('*.py'))
          for path in files:
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print(f'Python syntax checked: {len(files)} files')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/v2.js
          node --check static/v22.js
          node --check static/v23.js
          node --check static/report-jobs.js
      - name: Verify generated stylesheet is current
        run: |
          python -B scripts/build_notebook_styles.py
          git diff --exit-code -- static/style.css
