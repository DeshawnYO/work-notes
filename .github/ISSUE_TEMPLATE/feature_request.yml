name: 功能建议
description: 描述工作场景、问题与期望结果
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前场景与问题
      description: "不填写客户或企业内部资料"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方式和范围
